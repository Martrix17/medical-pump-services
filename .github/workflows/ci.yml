name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy: 
      matrix:
        include:
        - build_type: Debug
          preset: debug
          build_dir: debug
        - build_type: Release
          preset: release
          build_dir: release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install CMake
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: 4.1.1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang-format clang-tidy

      - name: Install Conan
        run: |
          pip install conan
          conan profile detect --force

      - name: Check tool versions
        run: |
          cmake --version
          ninja --version
          conan --version

      - name: Install dependencies
        run: |
          conan install . \
           --output-folder=build/${{ matrix.build_dir }} \ 
           --build=missing \ 
           -s build_type=${{ matrix.build_type }}

      - name: Configure 
        run: | 
          cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Run tests
        run: | 
          ctest --preset ${{ matrix.preset }}

  format:
    name: Check formatting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format

      - name: Check formatting
        shell: bash
        run: |
          files=$(git ls-files '*.cpp' '*.hpp' '*.h' '*.cc' '*.cxx')

          if [ -z "$files" ]; then
            echo "No C++ source files found."
            exit 0
          fi

          clang-format --dry-run --Werror $files

  clang-tidy:
    name: Static analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install CMake
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: 4.1.1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang-tidy

      - name: Install Conan
        run: |
          pip install conan
          conan profile detect --force

      - name: Check tool versions
        run: |
          cmake --version
          ninja --version
          conan --version

      - name: Install Conan dependencies
        run: |
          conan install . \
            --output-folder=build/debug-tidy \
            --build=missing \
            -s build_type=Debug

      - name: Configure with clang-tidy
        run: cmake --preset debug-tidy

      - name: Build with clang-tidy
        run: cmake --build --preset debug-tidy
