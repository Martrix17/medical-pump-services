name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            clang-format \
            clang-tidy

      - name: Install Conan
        run: |
          python -m pip install --upgrade pip
          pip install conan

      - name: Configure Conan profile
        run: |
          conan profile detect --force

      - name: Install Conan dependencies
        run: |
          conan install . \
            --output-folder=build/debug \
            --build=missing \
            -s build_type=Debug

      - name: Configure CMake
        run: |
          cmake --preset debug

      - name: Build
        run: |
          cmake --build --preset debug

      - name: Run tests
        run: |
          ctest --preset debug

  format:
    name: Check formatting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format

      - name: Check formatting
        shell: bash
        run: |
          files=$(git ls-files '*.cpp' '*.hpp' '*.h' '*.cc' '*.cxx')

          if [ -z "$files" ]; then
            echo "No C++ source files found."
            exit 0
          fi

          clang-format --dry-run --Werror $files

  clang-tidy:
    name: Static analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            clang-tidy

      - name: Install Conan
        run: |
          python -m pip install --upgrade pip
          pip install conan

      - name: Configure Conan profile
        run: |
          conan profile detect --force

      - name: Install Conan dependencies
        run: |
          conan install . \
            --output-folder=build/debug-tidy \
            --build=missing \
            -s build_type=Debug

      - name: Configure CMake
        run: |
          cmake --preset debug-tidy

      - name: Build with clang-tidy
        run: |
          cmake --build --preset debug-tidy
