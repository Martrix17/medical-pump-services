name: CI

on:
  push:
  pull_request:

jobs:
  format:
    name: Check formatting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format

      - name: Check formatting
        shell: bash
        run: |
          files=$(git ls-files '*.cpp' '*.hpp' '*.h' '*.cc' '*.cxx')

          if [ -z "$files" ]; then
            echo "No C++ source files found."
            exit 0
          fi

          clang-format --dry-run --Werror $files

  build-and-test:
    runs-on: ubuntu-latest

    strategy: 
      matrix:
        include:
        - build_type: Debug
          preset: debug
          build_dir: debug
        - build_type: Release
          preset: release
          build_dir: release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build netcat-openbsd

      - name: Install CMake
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: 4.1.1
          
      - name: Install Conan
        run: |
          python -m pip install --upgrade pip
          pip install conan
          conan profile detect --force

      - name: Check tool versions
        run: |
          cmake --version
          ninja --version
          conan --version

      - name: Start Kafka
        run: |
          docker compose up -d kafka

      - name: Wait for Kafka
        run: | 
          echo "Waiting for Kafka..."
          for i in {1..30}; do
            if nc -z localhost 9092; then 
              echo "Kafka port is available."
              exit 0
            fi
            
            echo "Kafka is not ready yet..."
            sleep 2
          done
          
          echo "Kafka did not become ready."
          docker compose logs kafka
          exit 1

      - name: Install Conan dependencies
        run: |
          conan install . \
            --output-folder=build/${{ matrix.build_dir }} \
            --build=missing \
            -s build_type=${{ matrix.build_type }}

      - name: Configure 
        run: | 
          cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        env: 
          KAFKA_BROKER: localhost:9092
        run: | 
          ctest --preset ${{ matrix.preset }}
        
      - name: Kafka logs
        if: failure()
        run: | 
          docker compose logs kafka
          
      - name: Stop services
        if: always()
        run: |
          docker compose down

  clang-tidy:
    name: Static analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang-tidy

      - name: Install CMake
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: 4.1.1

      - name: Install Conan
        run: |
          pip install conan
          conan profile detect --force

      - name: Check tool versions
        run: |
          cmake --version
          ninja --version
          conan --version

      - name: Install Conan dependencies
        run: |
          conan install . \
            --output-folder=build/debug-tidy \
            --build=missing \
            -s build_type=Debug

      - name: Configure
        run: |
          cmake --preset debug-tidy

      - name: Build
        run: |
          cmake --build --preset debug-tidy
